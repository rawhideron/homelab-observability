tempo:
  reportingEnabled: false
  # The chart's default 1 GiB ballast fights the 1 GiB limit. Instead, GOMEMLIMIT
  # makes the Go GC work harder near the limit rather than letting Tempo stall
  # and get killed by its liveness probe. The host has little free memory, so
  # the limit stays at 1Gi.
  memBallastSizeMbs: 0
  extraEnv:
    - name: GOMEMLIMIT
      value: "900MiB"
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  retention: 336h
  # Grafana's Traces Drilldown runs TraceQL metrics queries (rate(),
  # histogram_over_time()), which only work with the generator's local-blocks
  # processor; without it they fail with "error finding generators: empty
  # ring". span-metrics / service-graphs are left off to save memory.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write
    processor:
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks

persistence:
  enabled: true
  size: 10Gi

serviceMonitor:
  enabled: false
