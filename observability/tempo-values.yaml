tempo:
  reportingEnabled: false
  # The chart's default 1 GiB ballast fights the 1 GiB limit. Instead, GOMEMLIMIT
  # makes the Go GC work harder near the limit rather than letting Tempo stall
  # and get killed by its liveness probe. The host has little free memory, so
  # the limit stays at 1Gi.
  memBallastSizeMbs: 0
  extraEnv:
    - name: GOMEMLIMIT
      value: "900MiB"
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  retention: 336h

persistence:
  enabled: true
  size: 10Gi

serviceMonitor:
  enabled: false
