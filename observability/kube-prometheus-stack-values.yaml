prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    retention: 15d
    retentionSize: "8GB"
    enableRemoteWriteReceiver: true
    tsdb:
      outOfOrderTimeWindow: 10m
    externalLabels:
      k8s_cluster_name: zephyrus
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1536Mi
        cpu: 1000m
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  service:
    type: NodePort
    nodePort: 30903
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 64Mi
        cpu: 100m

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  # 250m/512Mi starved Grafana once the multi-cluster and Hosts dashboards
  # (17-20 queries each, 1m refresh) were in use: it sat at the CPU limit and
  # probes timed out ("Failed to fetch"). Memory stays modest: the host is tight.
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 768Mi
      cpu: 1000m
  service:
    type: NodePort
    nodePort: 30300
  grafana.ini:
    server:
      root_url: "http://192.168.1.176:30300"
  sidecar:
    # Chart default 2.14.1 ships certifi with the compromised emSign roots
    # (GHSA-6q48-6c7w-9gw2); 2.14.3 scans 0 critical (goodman_reunion #881).
    image:
      tag: 2.14.3
    datasources:
      defaultDatasourceEnabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          # In-cluster Service: a node IP + NodePort breaks whenever kind nodes
          # are recreated or retired (the old 172.18.0.5:30900 stopped answering).
          url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          access: proxy
          isDefault: true
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      url: http://tempo.observability.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        httpMethod: GET
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1m"
          spanEndTimeShift: "1m"
          tags:
            - key: k8s.namespace.name
              value: namespace
            - key: k8s.pod.name
              value: pod
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki

nodeExporter:
  enabled: true
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 100m

prometheus-node-exporter:
  # The chart's defaults plus run/nvidia-ctk-hook*: the NVIDIA Container Toolkit
  # leaves a full 4KB tmpfs per GPU container in the kind nodes, which fired
  # NodeFilesystemAlmostOutOfSpace forever. extraArgs replaces the chart's
  # list, so the fs-types default is repeated here.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|run/nvidia-ctk-hook[^/]*|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
  prometheus:
    monitor:
      metricRelabelings:
        - targetLabel: k8s_cluster_name
          replacement: zephyrus

kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - targetLabel: k8s_cluster_name
        replacement: zephyrus
    cAdvisorMetricRelabelings:
      - action: drop
        regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
        sourceLabels: [__name__]
      - action: drop
        regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
        sourceLabels: [__name__]
      - action: drop
        regex: container_memory_(mapped_file|swap)
        sourceLabels: [__name__]
      - targetLabel: k8s_cluster_name
        replacement: zephyrus

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 100m
  prometheus:
    monitor:
      metricRelabelings:
        - targetLabel: k8s_cluster_name
          replacement: zephyrus

# Kind clusters don't expose these endpoints
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
